apiVersion: v1
kind: Namespace
metadata:
  name: xt-whatif
  labels:
    app.kubernetes.io/name: xt-whatif
    app.kubernetes.io/part-of: xt-whatif-cloud
---
# =============================================================================
# 1. Deployment: xt-whatif-aks-worker (Dedicated Compute Engine for xT & Voronoi)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xt-whatif-aks-worker
  namespace: xt-whatif
  labels:
    app: xt-whatif-aks-worker
    role: worker
    tier: compute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xt-whatif-aks-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: xt-whatif-aks-worker
        role: worker
        tier: compute
    spec:
      containers:
        - name: worker
          image: xtwhatifprodacr.azurecr.io/xt-whatif-backend:latest  # CI replaces the tag with the commit SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SERVICE_ROLE
              value: "aks-worker"
            - name: ENVIRONMENT
              value: "production"
            - name: AZURE_OPENAI_API_VERSION
              value: "2024-10-21"
            - name: AZURE_OPENAI_DEPLOYMENT_GPT4O
              value: "gpt-4o"
            - name: AZURE_OPENAI_DEPLOYMENT_MINI
              value: "gpt-4o-mini"
            - name: BACKEND_CORS_ORIGINS
              value: '["*"]'
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-credentials
                  key: api-key
                  optional: true
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: openai-endpoint
                  optional: true
          # Optimized for heavy vectorized numpy & scipy.spatial.KDTree calculations
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
# =============================================================================
# 2. Service: xt-whatif-aks-worker-svc (Internal ClusterIP for ACA Ingress / VPC)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: xt-whatif-aks-worker-svc
  namespace: xt-whatif
  labels:
    app: xt-whatif-aks-worker
spec:
  type: ClusterIP
  selector:
    app: xt-whatif-aks-worker
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# =============================================================================
# 3. HorizontalPodAutoscaler: CPU-based Elastic Autoscaling (3 to 12 Pods)
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xt-whatif-aks-worker-hpa
  namespace: xt-whatif
  labels:
    app: xt-whatif-aks-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xt-whatif-aks-worker
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
