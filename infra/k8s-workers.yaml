apiVersion: v1
kind: Namespace
metadata:
  name: pitchghost
---
# -----------------------------------------------------------------------------
# Redis Cache Deployment & Service
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchghost-redis
  namespace: pitchghost
  labels:
    app: pitchghost-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pitchghost-redis
  template:
    metadata:
      labels:
        app: pitchghost-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: pitchghost
spec:
  selector:
    app: pitchghost-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# -----------------------------------------------------------------------------
# FastAPI Backend Deployment & Service
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchghost-backend
  namespace: pitchghost
  labels:
    app: pitchghost-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pitchghost-backend
  template:
    metadata:
      labels:
        app: pitchghost-backend
    spec:
      containers:
        - name: backend
          image: pitchghostacr.azurecr.io/pitchghost-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis-service.pitchghost.svc.cluster.local:6379/0"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: pitchghost
spec:
  type: ClusterIP
  selector:
    app: pitchghost-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# -----------------------------------------------------------------------------
# Asynchronous Tactical Simulation Workers (Voronoi & Agent Swarm Batch Processing)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchghost-workers
  namespace: pitchghost
  labels:
    app: pitchghost-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pitchghost-worker
  template:
    metadata:
      labels:
        app: pitchghost-worker
    spec:
      containers:
        - name: worker
          image: pitchghostacr.azurecr.io/pitchghost-backend:latest
          command: ["python", "-m", "app.services.tactical_math"]
          env:
            - name: REDIS_URL
              value: "redis://redis-service.pitchghost.svc.cluster.local:6379/0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
---
# -----------------------------------------------------------------------------
# Kubernetes Ingress
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pitchghost-ingress
  namespace: pitchghost
  annotations:
    kubernetes.io/ingress.class: addon-http-application-routing
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
