name: CI/CD - Cloud-Native Hybrid Deployment (ACA + AKS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: "Deploy to Azure ACA and AKS (requires Azure secrets configured)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  # Must match the registry name Bicep derives from environmentName (xtwhatif-prod -> xtwhatifprodacr).
  ACR_NAME: ${{ vars.ACR_NAME || 'xtwhatifprodacr' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RG || 'rg-xtwhatif-hackathon' }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'aks-xtwhatif-prod' }}
  BACKEND_IMAGE: xt-whatif-backend
  FRONTEND_IMAGE: xt-whatif-frontend

jobs:
  # ===========================================================================
  # 1. Backend Validation & Phase 2/3 Test Suites
  # ===========================================================================
  test-backend:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend

      - name: Run Synthetic Data Generator Tests
        run: python backend/test_synthetic_generator.py
        env:
          PYTHONPATH: ./backend

      - name: Run Personalised Narration Tests (language x audience)
        run: python backend/test_narration.py
        env:
          PYTHONPATH: ./backend

      - name: Run Game Engine Tests (action value, rules, optimiser, score)
        run: python backend/test_game_engine.py
        env:
          PYTHONPATH: ./backend

      - name: Run Live Match Tests (full match, moment cycle, bots, socket)
        run: python backend/test_live_match.py
        env:
          PYTHONPATH: ./backend

      - name: Run TTS Service Tests
        run: python backend/test_tts_service.py
        env:
          PYTHONPATH: ./backend

      - name: Run Public Demo Guardrail Tests
        run: python backend/test_hardening.py
        env:
          PYTHONPATH: ./backend

      - name: Run Phase 2 Math & AI Swarm Tests
        run: python backend/test_phase2.py
        env:
          PYTHONPATH: ./backend

      - name: Run Phase 3 Cloud Architecture & Circuit Breaker Tests
        run: python backend/test_phase3_cloud.py
        env:
          PYTHONPATH: ./backend

  # ===========================================================================
  # 2. Frontend Validation & TypeScript Strict Compilation
  # ===========================================================================
  test-frontend:
    name: Frontend Verification (Next.js 15 & TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Strict Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ===========================================================================
  # 3. Docker Build, ACR Push & Azure Hybrid Deployment (ACA + AKS)
  # (Only executed via manual dispatch until Azure credentials are fully provisioned)
  # ===========================================================================
  deploy-cloud:
    name: Build & Deploy to Azure (ACA + AKS)
    needs: [test-backend, test-frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Authentication
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # Backend URLs are not baked in: the Bicep template sets API_URL / WS_URL /
          # LIVE_API_URL / LIVE_WS_URL on the container and the page reads them at runtime.
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest

      - name: Provision / Update Azure Container Apps (Bicep IaC)
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          # Without the Azure OpenAI secret the agents run on their deterministic fallback.
          parameters: >-
            environmentName=xtwhatif-prod
            imageTag=${{ github.sha }}
            azureOpenAiEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT || 'https://xtwhatif-openai.openai.azure.com/' }}
            azureOpenAiKey=${{ secrets.AZURE_OPENAI_API_KEY || 'mock-azure-openai-key' }}

      - name: Deployment URLs
        run: |
          {
            echo "### xT-WhatIf deployed"
            echo "- Frontend: ${{ steps.bicep.outputs.frontendUrl }}"
            echo "- Gateway API: ${{ steps.bicep.outputs.gatewayUrl }}"
            echo "- Live match: ${{ steps.bicep.outputs.liveUrl }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # AKS is optional: set the repository variable AKS_ENABLED=true once the cluster exists.
      - name: Set AKS Cluster Context
        if: vars.AKS_ENABLED == 'true'
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy AKS Compute Workers & HPA
        if: vars.AKS_ENABLED == 'true'
        run: |
          kubectl apply -f ./infra/k8s-aks-workers.yaml
          kubectl set image deployment/xt-whatif-aks-worker worker=${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n xt-whatif
