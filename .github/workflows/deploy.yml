name: Deploy to Azure (ACA & AKS)

on:
  push:
    branches:
      - main
      - chore/azure-deploy
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'xtwhatifprodacr' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RG || 'rg-xt-whatif' }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'aks-xtwhatif-prod' }}
  BACKEND_IMAGE: xt-whatif-backend
  FRONTEND_IMAGE: xt-whatif-frontend

jobs:
  build-and-deploy:
    name: Build, Push & Update Azure Deployments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Logs into Azure using a Service Principal (stored in secrets)
      - name: Log in to Azure using Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Authenticate Docker client against Azure Container Registry (auto-discover or provision if missing)
      - name: Ensure Azure Container Registry Exists & Log In
        run: |
          echo "Looking for existing Azure Container Registry in ${{ env.RESOURCE_GROUP }}..."
          EXISTING_ACR=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv 2>/dev/null || true)
          if [ -n "$EXISTING_ACR" ] && [ "$EXISTING_ACR" != "null" ]; then
            echo "Found existing ACR in ${{ env.RESOURCE_GROUP }}: $EXISTING_ACR"
            TARGET_ACR="$EXISTING_ACR"
          else
            TARGET_ACR="${{ env.ACR_NAME }}"
            echo "No existing ACR found in ${{ env.RESOURCE_GROUP }}. Checking if $TARGET_ACR exists..."
            if ! az acr show --name "$TARGET_ACR" &>/dev/null; then
              LOCATION=$(az group show --name ${{ env.RESOURCE_GROUP }} --query location -o tsv)
              echo "Provisioning new ACR $TARGET_ACR in location $LOCATION..."
              az acr create \
                --name "$TARGET_ACR" \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --location "$LOCATION" \
                --sku Basic \
                --admin-enabled false
            fi
          fi
          echo "Using ACR: $TARGET_ACR"
          echo "ACR_NAME=$TARGET_ACR" >> $GITHUB_ENV
          az acr login --name "$TARGET_ACR"

      # 3. Builds backend Docker image
      # 4. Tags the image using Git SHA (${{ github.sha }}) instead of latest
      # 5. Pushes to ACR
      - name: Build and Push Backend Image (Git SHA)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # 3. Builds frontend Docker image
      # 4. Tags the image using Git SHA (${{ github.sha }}) instead of latest
      # 5. Pushes to ACR
      - name: Build and Push Frontend Image (Git SHA)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # 5b. Provision / Update Azure Infrastructure and Container Apps via Bicep IaC
      - name: Provision / Update Azure Infrastructure (Bicep IaC)
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >-
            environmentName=xtwhatif-prod
            acrName=${{ env.ACR_NAME }}
            imageTag=${{ github.sha }}
            azureOpenAiEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT || vars.AZURE_OPENAI_ENDPOINT || 'https://xtwhatif-openai.openai.azure.com/' }}
            azureOpenAiKey=${{ secrets.AZURE_OPENAI_API_KEY || 'mock-azure-openai-key' }}
            azureOpenAiTtsDeployment=${{ vars.AZURE_OPENAI_TTS_DEPLOYMENT || 'gpt-4o-mini-tts' }}
            azureOpenAiTtsApiVersion=${{ vars.AZURE_OPENAI_TTS_API_VERSION || '2025-03-01-preview' }}

      # 6a. Updates the Azure Container Apps with the new SHA tag
      - name: Update Azure Container Apps (ACA Revisions)
        run: |
          echo "Updating ACA Gateway container image to ${{ github.sha }}..."
          az containerapp update \
            --name xt-whatif-aca-gateway \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} || true

          echo "Updating ACA Live match container image to ${{ github.sha }}..."
          az containerapp update \
            --name xt-whatif-live \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} || true

          echo "Updating ACA Frontend container image to ${{ github.sha }}..."
          az containerapp update \
            --name xt-whatif-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} || true

      # 6b. Updates the AKS deployment with the new SHA tag (if AKS cluster exists)
      - name: Set AKS Cluster Context
        id: aks_context
        continue-on-error: true
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Update AKS Compute Workers Deployment
        if: steps.aks_context.outcome == 'success'
        run: |
          echo "Applying Kubernetes manifests..."
          kubectl apply -f ./infra/k8s-aks-workers.yaml

          echo "Updating AKS Worker image to ${{ github.sha }}..."
          kubectl set image deployment/xt-whatif-aks-worker worker=${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n xt-whatif

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/xt-whatif-aks-worker -n xt-whatif --timeout=180s
