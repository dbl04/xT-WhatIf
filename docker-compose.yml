# Local copy of the Azure layout (infra/main.bicep):
#   gateway  - stateless API (simulations, optimiser, TTS, telemetry), LIVE_ENABLED=false
#   live     - the single live match: /ws/live and the preview of live moments
#   frontend - Next.js; backend URLs are read at runtime from API_URL / WS_URL / LIVE_*
services:
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xt-whatif-gateway
    ports:
      - "8000:8000"
    env_file:
      - path: .env  # Azure OpenAI keys; optional (without it the agents use their rule-based fallback)
        required: false
    environment:
      - SERVICE_ROLE=aca-gateway
      - LIVE_ENABLED=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  live:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xt-whatif-live
    ports:
      - "8001:8000"
    env_file:
      - path: .env  # Azure OpenAI keys; optional (without it the agents use their rule-based fallback)
        required: false
    environment:
      - SERVICE_ROLE=live
      - LIVE_ENABLED=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xt-whatif-frontend
    ports:
      - "3000:3000"
    environment:
      # The browser calls these, so they are addresses on the host, not compose service names.
      - API_URL=http://localhost:8000
      - WS_URL=ws://localhost:8000
      - LIVE_API_URL=http://localhost:8001
      - LIVE_WS_URL=ws://localhost:8001
    depends_on:
      - gateway
      - live
